<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>مغز دوم · بنر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0e0e14;
            color: #eae7de;
            font-family: 'Segoe UI', 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
        }
        .banner-card {
            max-width: 600px;
            width: 100%;
            background: #1a1a24;
            border: 1px solid #323242;
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .banner-card .close {
            position: absolute;
            top: 16px;
            left: 16px;
            background: transparent;
            border: none;
            color: #5f5d6b;
            font-size: 24px;
            cursor: pointer;
            transition: 0.15s;
            line-height: 1;
            text-decoration: none;
        }
        .banner-card .close:hover {
            color: #cf6f6f;
            transform: rotate(90deg);
        }
        .banner-card h2 {
            font-family: 'Fraunces', serif;
            font-size: 24px;
            text-align: center;
            margin-bottom: 6px;
            color: #eae7de;
        }
        .banner-card .sub {
            text-align: center;
            color: #8d8a9a;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .banner-content {
            background: #1e1e28;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0 18px;
            border: 1px solid #323242;
            min-height: 80px;
            text-align: center;
        }
        .banner-content img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
        }
        .banner-actions {
            display: flex;
            justify-content: center;
        }
        .banner-actions .btn {
            background: #d6a35c;
            color: #0e0e14;
            border: none;
            padding: 10px 32px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .banner-actions .btn:hover {
            background: #e2b06f;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(214, 163, 92, 0.3);
        }
        .status {
            text-align: center;
            font-size: 12px;
            color: #5f5d6b;
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 8px;
            background: #1e1e28;
            border: 1px solid #323242;
        }
        .status.success {
            color: #6fb3a0;
            border-color: #6fb3a0;
        }
        .status.error {
            color: #cf6f6f;
            border-color: #cf6f6f;
        }
        .status.info {
            color: #9382d6;
            border-color: #9382d6;
        }
        .lang-switch {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 14px;
        }
        .lang-switch button {
            background: transparent;
            border: 1px solid #323242;
            color: #8d8a9a;
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: 0.15s;
        }
        .lang-switch button.active {
            background: #d6a35c;
            color: #0e0e14;
            border-color: #d6a35c;
            font-weight: 600;
        }
        .lang-switch button:hover:not(.active) {
            border-color: #d6a35c;
            color: #eae7de;
        }
        .loader {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(214, 163, 92, 0.15);
            border-top-color: #d6a35c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .retry-btn {
            background: transparent;
            border: 1px solid #6fb3a0;
            color: #6fb3a0;
            padding: 6px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: 0.15s;
        }
        .retry-btn:hover {
            background: rgba(111, 179, 160, 0.1);
        }
        .version-badge {
            font-size: 11px;
            color: #3a3a4a;
            text-align: center;
            margin-top: 8px;
            cursor: pointer;
        }
        .version-badge:hover {
            color: #6fb3a0;
        }
        .test-result {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            background: #1a1a2a;
            border: 1px solid #2a2a3a;
        }
        .test-result.pass {
            border-color: #6fb3a0;
            color: #6fb3a0;
        }
        .test-result.fail {
            border-color: #cf6f6f;
            color: #cf6f6f;
        }
        .test-result.info {
            border-color: #9382d6;
            color: #9382d6;
        }
        .test-result i {
            margin-left: 6px;
        }
    </style>
</head>
<body>

    <div class="banner-card" id="bannerCard">
        <a class="close" id="closeBtn" href="index2.html">✕</a>
        <h2 id="bannerTitle">📢 در حال بارگذاری…</h2>
        <p class="sub" id="bannerSub">لطفاً چند لحظه صبر کنید</p>

        <div class="banner-content" id="bannerContent">
            <div class="flex-center" id="loaderWrap">
                <div class="loader"></div>
                <span style="color:#8d8a9a;font-size:13px;">دریافت از GitHub…</span>
            </div>
            <div id="bannerHtml" class="hidden"></div>
        </div>

        <div class="banner-actions">
            <button class="btn" id="actionBtn">مشاهده</button>
        </div>

        <div class="status" id="statusMsg">در حال اتصال…</div>

        <!-- نتیجه تست مقایسه با گیت‌هاب -->
        <div class="test-result" id="testResult">⏳ در حال بررسی…</div>

        <div class="lang-switch">
            <button id="langFa" class="active">فارسی</button>
            <button id="langEn">English</button>
        </div>
        <div class="version-badge" id="versionBadge">📦 نسخه: v1.0.0 · کلیک برای بروزرسانی</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  🔥 نسخه فایل — هر بار که فایل JS را تغییر می‌دهید،
            //  این عدد را افزایش دهید تا کش مرورگر و CDN دور زده شود
            //  ============================================================
            const FILE_VERSION = '2.0.3'; // <-- این عدد را هر بار تغییر دهید

            // ============================================================
            //  آدرس فایل JS با نسخه
            //  ============================================================
            const JS_URL = 'https://cdn.jsdelivr.net/gh/IQZEUS/brainmain@main/banner.js?v=' + FILE_VERSION;
            const RAW_URL = 'https://raw.githubusercontent.com/IQZEUS/brainmain/refs/heads/main/banner.js';

            // ============================================================
            //  DOM REFS
            // ============================================================
            const titleEl = document.getElementById('bannerTitle');
            const subEl = document.getElementById('bannerSub');
            const htmlContainer = document.getElementById('bannerHtml');
            const loaderWrap = document.getElementById('loaderWrap');
            const actionBtn = document.getElementById('actionBtn');
            const statusMsg = document.getElementById('statusMsg');
            const langFa = document.getElementById('langFa');
            const langEn = document.getElementById('langEn');
            const closeBtn = document.getElementById('closeBtn');
            const versionBadge = document.getElementById('versionBadge');
            const testResult = document.getElementById('testResult');

            let currentLang = 'fa';
            let bannerData = null;
            let isFetching = false;

            // ============================================================
            //  RENDER — فقط از داده‌های دریافتی
            // ============================================================
            function render(lang, data) {
                if (!data) {
                    titleEl.textContent = '⚠️ خطا';
                    subEl.textContent = 'داده‌ای دریافت نشد';
                    htmlContainer.classList.add('hidden');
                    loaderWrap.classList.remove('hidden');
                    loaderWrap.innerHTML = `
                        <span style="color:#cf6f6f;font-size:14px;">❌ داده‌ای دریافت نشد</span>
                        <span style="font-size:12px;color:#5f5d6b;">فایل JS خالی یا نامعتبر است</span>
                        <button class="retry-btn" id="retryBtn">🔄 تلاش مجدد</button>
                    `;
                    document.getElementById('retryBtn')?.addEventListener('click', () => fetchBanner(currentLang));
                    actionBtn.textContent = 'تلاش مجدد';
                    actionBtn.onclick = () => fetchBanner(currentLang);
                    statusMsg.textContent = 'خطا: داده‌ای وجود ندارد';
                    statusMsg.className = 'status error';
                    return;
                }

                titleEl.textContent = data.title || '📢 Announcement';
                subEl.textContent = data.sub || 'Latest news & updates';
                htmlContainer.innerHTML = data.html || '<div class="placeholder">No content</div>';
                htmlContainer.classList.remove('hidden');
                loaderWrap.classList.add('hidden');

                const btn = data.button || { label: '📖 View', link: '#' };
                actionBtn.textContent = btn.label || '📖 View';
                actionBtn.onclick = () => {
                    if (btn.link && btn.link !== '#') {
                        window.open(btn.link, '_blank');
                    } else {
                        alert('لینکی تنظیم نشده است.');
                    }
                };

                statusMsg.textContent = '✅ بارگذاری موفق · نسخه ' + FILE_VERSION;
                statusMsg.className = 'status success';
                versionBadge.textContent = '📦 نسخه: ' + FILE_VERSION + ' · کلیک برای بروزرسانی';
            }

            // ============================================================
            //  تست مقایسه با فایل RAW گیت‌هاب (با مدیریت خطا)
            // ============================================================
            async function testAgainstGitHub() {
                try {
                    testResult.textContent = '⏳ مقایسه با گیت‌هاب…';
                    testResult.className = 'test-result';

                    const response = await fetch(RAW_URL + '?t=' + Date.now(), {
                        cache: 'reload',
                        headers: { 'Cache-Control': 'no-cache' }
                    });

                    if (!response.ok) {
                        // اگر خطا داشت، فقط یه پیام اطلاع‌رسانی نشون بده
                        testResult.innerHTML = 'ℹ️ امکان مقایسه با گیت‌هاب وجود ندارد (محدودیت CORS)';
                        testResult.className = 'test-result info';
                        return;
                    }

                    const rawText = await response.text();
                    const match = rawText.match(/window\.BANNER_DATA\s*=\s*({[\s\S]*?});/);
                    if (!match) throw new Error('ساختار نامعتبر');
                    const rawData = JSON.parse(match[1]);

                    const currentData = bannerData || {};
                    const isMatch = JSON.stringify(currentData) === JSON.stringify(rawData);

                    if (isMatch) {
                        testResult.innerHTML = '✅ فایل با گیت‌هاب هم‌خوانی دارد';
                        testResult.className = 'test-result pass';
                    } else {
                        testResult.innerHTML = '⚠️ فایل با گیت‌هاب هم‌خوانی ندارد!<br><span style="font-size:11px;color:#8d8a9a;">نسخه محلی با نسخه گیت‌هاب متفاوت است.</span>';
                        testResult.className = 'test-result fail';
                    }

                    const versionMatch = rawText.match(/FILE_VERSION\s*=\s*['"]([^'"]+)['"]/);
                    if (versionMatch) {
                        testResult.innerHTML += `<br><span style="font-size:10px;color:#5f5d6b;">نسخه گیت‌هاب: ${versionMatch[1]}</span>`;
                    }

                } catch (e) {
                    // در صورت هر گونه خطا (از جمله CORS)، فقط پیام اطلاع‌رسانی نشون بده
                    console.warn('مقایسه با گیت‌هاب انجام نشد:', e.message);
                    testResult.innerHTML = 'ℹ️ امکان مقایسه با گیت‌هاب وجود ندارد (مشکل شبکه یا CORS)';
                    testResult.className = 'test-result info';
                }
            }

            // ============================================================
            //  FETCH — بارگذاری داینامیک فایل JS با نسخه‌گذاری
            // ============================================================
            function loadScript(url) {
                return new Promise((resolve, reject) => {
                    const oldScript = document.querySelector('script[data-banner-script]');
                    if (oldScript) oldScript.remove();

                    const script = document.createElement('script');
                    script.src = url;
                    script.setAttribute('data-banner-script', 'true');
                    script.crossOrigin = 'anonymous';
                    script.onload = () => {
                        if (window.BANNER_DATA) {
                            resolve(window.BANNER_DATA);
                        } else {
                            reject(new Error('BANNER_DATA not found'));
                        }
                    };
                    script.onerror = () => reject(new Error('Script load error'));
                    document.head.appendChild(script);
                });
            }

            async function fetchBanner(lang) {
                if (isFetching) return;
                isFetching = true;

                // نمایش لودینگ
                titleEl.textContent = '⏳ در حال بارگذاری…';
                subEl.textContent = 'دریافت از GitHub (نسخه ' + FILE_VERSION + ')';
                htmlContainer.classList.add('hidden');
                loaderWrap.classList.remove('hidden');
                loaderWrap.innerHTML = `
                    <div class="loader"></div>
                    <span style="color:#8d8a9a;font-size:13px;">دریافت از GitHub…</span>
                `;
                actionBtn.textContent = '…';
                statusMsg.textContent = 'در حال دریافت نسخه ' + FILE_VERSION + '…';
                statusMsg.className = 'status';

                try {
                    const json = await loadScript(JS_URL);
                    localStorage.setItem('banner-cache', JSON.stringify(json));
                    localStorage.setItem('banner-version', FILE_VERSION);
                    bannerData = json;
                    const data = json[lang] || json.en;
                    render(lang, data);
                    updateLangButtons(lang);
                    statusMsg.textContent = '✅ دریافت موفق · نسخه ' + FILE_VERSION;
                    statusMsg.className = 'status success';

                    // بعد از دریافت، تست مقایسه انجام بده (خطاهای آن مدیریت می‌شود)
                    await testAgainstGitHub();

                } catch (e) {
                    console.warn('خطا در بارگذاری JS:', e);
                    try {
                        const cachedVersion = localStorage.getItem('banner-version');
                        const cached = localStorage.getItem('banner-cache');
                        if (cached && cachedVersion === FILE_VERSION) {
                            const cachedJson = JSON.parse(cached);
                            bannerData = cachedJson;
                            const data = cachedJson[lang] || cachedJson.en;
                            if (data) {
                                render(lang, data);
                                updateLangButtons(lang);
                                statusMsg.textContent = '⚠️ استفاده از کش (نسخه ' + FILE_VERSION + ')';
                                statusMsg.className = 'status info';
                                await testAgainstGitHub();
                                isFetching = false;
                                return;
                            }
                        }
                    } catch (_) {}
                    render(lang, null);
                    statusMsg.textContent = '❌ خطا در بارگذاری فایل JS';
                    statusMsg.className = 'status error';
                    testResult.innerHTML = '❌ خطا: ' + e.message;
                    testResult.className = 'test-result fail';
                }

                isFetching = false;
            }

            // ============================================================
            //  LANGUAGE SWITCH
            // ============================================================
            function updateLangButtons(lang) {
                langFa.classList.toggle('active', lang === 'fa');
                langEn.classList.toggle('active', lang === 'en');
                currentLang = lang;
                document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
                document.documentElement.lang = lang;
                if (bannerData) {
                    const data = bannerData[lang] || bannerData.en;
                    render(lang, data);
                }
            }

            langFa.addEventListener('click', () => {
                if (currentLang === 'fa') return;
                currentLang = 'fa';
                updateLangButtons('fa');
                if (bannerData) {
                    const data = bannerData.fa || bannerData.en;
                    render('fa', data);
                } else {
                    fetchBanner('fa');
                }
            });

            langEn.addEventListener('click', () => {
                if (currentLang === 'en') return;
                currentLang = 'en';
                updateLangButtons('en');
                if (bannerData) {
                    const data = bannerData.en || bannerData.fa;
                    render('en', data);
                } else {
                    fetchBanner('en');
                }
            });

            // ============================================================
            //  CLOSE BUTTON
            // ============================================================
            closeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'index2.html';
            });

            // ============================================================
            //  FORCE REFRESH
            // ============================================================
            versionBadge.addEventListener('click', function() {
                if (confirm('بارگذاری مجدد با آخرین نسخه از GitHub؟')) {
                    localStorage.removeItem('banner-cache');
                    localStorage.removeItem('banner-version');
                    testResult.innerHTML = '⏳ در حال بروزرسانی…';
                    testResult.className = 'test-result';
                    fetchBanner(currentLang);
                }
            });

            // ============================================================
            //  INIT
            // ============================================================
            (async function init() {
                // بررسی کش با نسخه
                try {
                    const cachedVersion = localStorage.getItem('banner-version');
                    const cached = localStorage.getItem('banner-cache');
                    if (cached && cachedVersion === FILE_VERSION) {
                        const json = JSON.parse(cached);
                        bannerData = json;
                        const data = json[currentLang] || json.en;
                        render(currentLang, data);
                        statusMsg.textContent = '📦 از کش · نسخه ' + FILE_VERSION;
                        statusMsg.className = 'status info';
                    }
                } catch (_) {}

                // دریافت از شبکه
                await fetchBanner(currentLang);
            })();

        })();
    </script>
</body>
</html>
