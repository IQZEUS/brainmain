<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغز دوم · بنر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background:
                radial-gradient(circle at 20% 20%, rgba(147, 130, 214, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(214, 163, 92, 0.12), transparent 40%),
                #08080d;
            color: #eae7de;
            font-family: 'Segoe UI', 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
            transition: background 0.3s, color 0.3s;
        }

        body.theme-light {
            background:
                radial-gradient(circle at 20% 20%, rgba(147, 130, 214, 0.08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(214, 163, 92, 0.08), transparent 40%),
                #f3f1ea;
            color: #24232b;
        }

        /* ============================================================
           کارت مشترک (پایه‌ی هر دو حالت: setup و بنر)
           ============================================================ */
        .card {
            max-width: 620px;
            width: 100%;
            background: linear-gradient(180deg, rgba(30, 30, 42, 0.9), rgba(18, 18, 26, 0.9));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                0 1px 0 rgba(255, 255, 255, 0.05) inset;
            position: relative;
            overflow: hidden;
            animation: rise 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        body.theme-light .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(250, 249, 245, 0.9));
            border-color: rgba(0, 0, 0, 0.06);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.12),
                0 1px 0 rgba(255, 255, 255, 0.6) inset;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -30%;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(214, 163, 92, 0.25), transparent 70%);
            pointer-events: none;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .fade-swap {
            animation: fadeSwap 0.35s ease;
        }

        @keyframes fadeSwap {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(147, 130, 214, 0.18), rgba(214, 163, 92, 0.18));
            border: 1px solid rgba(214, 163, 92, 0.3);
            color: #e2c491;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin: 0 auto 16px;
            width: fit-content;
            letter-spacing: 0.3px;
        }

        .hidden {
            display: none !important;
        }

        /* ============================================================
           SETUP VIEW (پرسش زبان و تم)
           ============================================================ */
        #setupView h1 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #f2ede0, #d6a35c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.theme-light #setupView h1 {
            background: linear-gradient(90deg, #6b4a1e, #d6a35c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #setupView .lead {
            text-align: center;
            color: #a5a2b3;
            font-size: 14px;
            margin-bottom: 28px;
        }

        body.theme-light #setupView .lead {
            color: #6a677a;
        }

        .section {
            margin-bottom: 22px;
        }

        .section-label {
            font-size: 12.5px;
            font-weight: 600;
            color: #8d8a9a;
            margin-bottom: 10px;
            display: block;
        }

        body.theme-light .section-label {
            color: #6a677a;
        }

        .options {
            display: flex;
            gap: 10px;
        }

        .option-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            color: #c8c5d3;
            padding: 14px 10px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: 0.18s;
        }

        body.theme-light .option-btn {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.08);
            color: #4a4756;
        }

        .option-btn .icon {
            font-size: 22px;
        }

        .option-btn:hover {
            border-color: rgba(214, 163, 92, 0.5);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, rgba(214, 163, 92, 0.18), rgba(147, 130, 214, 0.12));
            border-color: #d6a35c;
            color: #f2ede0;
            box-shadow: 0 6px 18px rgba(214, 163, 92, 0.18);
        }

        body.theme-light .option-btn.selected {
            color: #3a2c12;
        }

        .continue-btn {
            width: 100%;
            background: linear-gradient(135deg, #e2b06f, #d6a35c);
            color: #14140f;
            border: none;
            padding: 13px;
            border-radius: 16px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 8px 24px rgba(214, 163, 92, 0.25);
            margin-top: 6px;
        }

        .continue-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(214, 163, 92, 0.4);
            filter: brightness(1.06);
        }

        .continue-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .hint {
            text-align: center;
            font-size: 11.5px;
            color: #5f5d6b;
            margin-top: 14px;
        }

        body.theme-light .hint {
            color: #9a97a8;
        }

        /* ============================================================
           BANNER VIEW (تبلیغات)
           ============================================================ */
        #bannerView .close {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            color: #9d9aac;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
            text-decoration: none;
            z-index: 2;
        }

        #bannerView .close:hover {
            color: #ff8a8a;
            border-color: rgba(255, 138, 138, 0.4);
            background: rgba(255, 138, 138, 0.08);
            transform: rotate(90deg);
        }

        #bannerView h2 {
            font-size: 25px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #f2ede0, #d6a35c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.4;
        }

        body.theme-light #bannerView h2 {
            background: linear-gradient(90deg, #6b4a1e, #d6a35c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #bannerView .sub {
            text-align: center;
            color: #a5a2b3;
            font-size: 14.5px;
            margin-bottom: 22px;
        }

        body.theme-light #bannerView .sub {
            color: #6a677a;
        }

        .banner-content {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 18px;
            margin: 0 0 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            min-height: 90px;
            text-align: center;
            position: relative;
        }

        body.theme-light .banner-content {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.06);
        }

        .banner-content img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 10px;
        }

        .banner-actions {
            display: flex;
            justify-content: center;
        }

        .banner-actions .btn {
            position: relative;
            background: linear-gradient(135deg, #e2b06f, #d6a35c);
            color: #14140f;
            border: none;
            padding: 12px 38px;
            border-radius: 30px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 8px 24px rgba(214, 163, 92, 0.25);
        }

        .banner-actions .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(214, 163, 92, 0.4);
            filter: brightness(1.06);
        }

        .banner-actions .btn:active {
            transform: translateY(0);
        }

        .status {
            text-align: center;
            font-size: 12.5px;
            color: #7d7a8c;
            margin-top: 16px;
            padding: 8px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.25s;
        }

        body.theme-light .status {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.06);
            color: #6a677a;
        }

        .status.success {
            color: #7fd6bd;
            border-color: rgba(127, 214, 189, 0.3);
            background: rgba(127, 214, 189, 0.06);
        }

        .status.error {
            color: #ff8a8a;
            border-color: rgba(255, 138, 138, 0.3);
            background: rgba(255, 138, 138, 0.06);
        }

        .status.info {
            color: #b3a3ec;
            border-color: rgba(179, 163, 236, 0.3);
            background: rgba(179, 163, 236, 0.06);
        }

        .loader {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(214, 163, 92, 0.15);
            border-top-color: #d6a35c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 12px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .flex-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .retry-btn {
            background: rgba(127, 214, 189, 0.08);
            border: 1px solid rgba(127, 214, 189, 0.35);
            color: #7fd6bd;
            padding: 7px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: 0.2s;
        }

        .retry-btn:hover {
            background: rgba(127, 214, 189, 0.16);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="card" id="card">

        <!-- ============================================================
             حالت اول: پرسیدن زبان و تم (فقط دفعه‌ی اول نمایش داده می‌شه)
             ============================================================ -->
        <div id="setupView">
            <div class="badge">🧠 مغز دوم</div>
            <h1 id="titleText">خوش‌آمدید</h1>
            <p class="lead" id="leadText">قبل از شروع، ترجیحاتت رو انتخاب کن</p>

            <div class="section">
                <span class="section-label" id="langLabel">زبان</span>
                <div class="options">
                    <button class="option-btn" data-type="lang" data-value="fa">
                        <span class="icon">🇮🇷</span>
                        <span>فارسی</span>
                    </button>
                    <button class="option-btn" data-type="lang" data-value="en">
                        <span class="icon">🇬🇧</span>
                        <span>English</span>
                    </button>
                </div>
            </div>

            <div class="section">
                <span class="section-label" id="themeLabel">تم</span>
                <div class="options">
                    <button class="option-btn" data-type="theme" data-value="dark">
                        <span class="icon">🌙</span>
                        <span id="darkLabel">تاریک</span>
                    </button>
                    <button class="option-btn" data-type="theme" data-value="light">
                        <span class="icon">☀️</span>
                        <span id="lightLabel">روشن</span>
                    </button>
                </div>
            </div>

            <button class="continue-btn" id="continueBtn" disabled>ادامه</button>
            <p class="hint" id="hintText">این پرسش فقط یک‌بار نمایش داده می‌شه</p>
        </div>

        <!-- ============================================================
             حالت دوم: خود بنر (بعد از انتخاب، یا مستقیم اگه قبلاً انتخاب شده)
             ============================================================ -->
        <div id="bannerView" class="hidden">
            <a class="close" id="closeBtn" href="index2.html">✕</a>

            <div class="badge">🧠 مغز دوم</div>
            <h2 id="bannerTitle">در حال بارگذاری…</h2>
            <p class="sub" id="bannerSub">لطفاً چند لحظه صبر کنید</p>

            <div class="banner-content" id="bannerContent">
                <div class="flex-center" id="loaderWrap">
                    <div class="loader"></div>
                    <span style="color:#8d8a9a;font-size:13px;">دریافت از GitHub…</span>
                </div>
                <div id="bannerHtml" class="hidden"></div>
            </div>

            <div class="banner-actions">
                <button class="btn" id="actionBtn">مشاهده</button>
            </div>

            <div class="status" id="statusMsg">در حال اتصال…</div>
        </div>

    </div>

    <script>
        (function () {
            const ONBOARDING_KEY = 'brain-onboarding';
            const CACHE_KEY = 'banner-cache';
            const CACHE_TIME_KEY = 'banner-cache-time';
            const FETCH_TIMEOUT_MS = 6000;

            const GH_USER = 'IQZEUS';
            const GH_REPO = 'brainmain';
            const GH_BRANCH = 'main';
            const GH_FILE = 'banner.js';
            const SOURCES = [
                `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/refs/heads/${GH_BRANCH}/${GH_FILE}`,
                `https://cdn.jsdelivr.net/gh/${GH_USER}/${GH_REPO}@${GH_BRANCH}/${GH_FILE}`,
                `https://cdn.statically.io/gh/${GH_USER}/${GH_REPO}/${GH_BRANCH}/${GH_FILE}`
            ];

            // ============================================================
            //  DOM REFS
            // ============================================================
            const setupView = document.getElementById('setupView');
            const bannerView = document.getElementById('bannerView');
            const continueBtn = document.getElementById('continueBtn');

            const titleEl = document.getElementById('bannerTitle');
            const subEl = document.getElementById('bannerSub');
            const htmlContainer = document.getElementById('bannerHtml');
            const loaderWrap = document.getElementById('loaderWrap');
            const actionBtn = document.getElementById('actionBtn');
            const statusMsg = document.getElementById('statusMsg');
            const closeBtn = document.getElementById('closeBtn');

            let selectedLang = null;
            let selectedTheme = null;
            let currentLang = 'fa';
            let bannerData = null;
            let isFetching = false;

            const TEXT = {
                fa: {
                    title: 'خوش‌آمدید', lead: 'قبل از شروع، ترجیحاتت رو انتخاب کن',
                    langLabel: 'زبان', themeLabel: 'تم', dark: 'تاریک', light: 'روشن',
                    continueBtn: 'ادامه', hint: 'این پرسش فقط یک‌بار نمایش داده می‌شه'
                },
                en: {
                    title: 'Welcome', lead: 'Before we start, pick your preferences',
                    langLabel: 'Language', themeLabel: 'Theme', dark: 'Dark', light: 'Light',
                    continueBtn: 'Continue', hint: 'This will only be shown once'
                }
            };

            function applySetupUiLang(lang) {
                const t = TEXT[lang] || TEXT.fa;
                document.getElementById('titleText').textContent = t.title;
                document.getElementById('leadText').textContent = t.lead;
                document.getElementById('langLabel').textContent = t.langLabel;
                document.getElementById('themeLabel').textContent = t.themeLabel;
                document.getElementById('darkLabel').textContent = t.dark;
                document.getElementById('lightLabel').textContent = t.light;
                continueBtn.textContent = t.continueBtn;
                document.getElementById('hintText').textContent = t.hint;
            }

            function applyDocLangDir(lang) {
                document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
                document.documentElement.lang = lang;
            }

            function applyTheme(theme) {
                document.body.classList.toggle('theme-light', theme === 'light');
            }

            // ============================================================
            //  SETUP VIEW — انتخاب گزینه‌ها
            // ============================================================
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.dataset.type;
                    const value = btn.dataset.value;

                    document.querySelectorAll(`.option-btn[data-type="${type}"]`)
                        .forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');

                    if (type === 'lang') {
                        selectedLang = value;
                        applySetupUiLang(value);
                        applyDocLangDir(value);
                    } else if (type === 'theme') {
                        selectedTheme = value;
                        applyTheme(value);
                    }

                    continueBtn.disabled = !(selectedLang && selectedTheme);
                });
            });

            continueBtn.addEventListener('click', () => {
                if (!selectedLang || !selectedTheme) return;
                try {
                    localStorage.setItem(ONBOARDING_KEY, JSON.stringify({
                        lang: selectedLang, theme: selectedTheme, done: true, savedAt: Date.now()
                    }));
                } catch (_) {}
                showBanner(selectedLang, selectedTheme);
            });

            // ============================================================
            //  انتقال به حالت بنر — بدون رفتن به فایل دیگه، همون صفحه
            // ============================================================
            function showBanner(lang, theme) {
                currentLang = lang;
                applyDocLangDir(lang);
                applyTheme(theme);

                setupView.classList.add('hidden');
                bannerView.classList.remove('hidden');
                bannerView.classList.add('fade-swap');

                fetchBanner(currentLang);
            }

            // ============================================================
            //  RENDER بنر
            // ============================================================
            function render(lang, data) {
                if (!data) {
                    titleEl.textContent = '⚠️ خطا';
                    subEl.textContent = 'داده‌ای دریافت نشد';
                    htmlContainer.classList.add('hidden');
                    loaderWrap.classList.remove('hidden');
                    loaderWrap.innerHTML = `
                        <span style="color:#ff8a8a;font-size:14px;">❌ اتصال به هیچ‌کدام از منابع برقرار نشد</span>
                        <span style="font-size:12px;color:#5f5d6b;">و کش قبلی هم موجود نیست</span>
                        <button class="retry-btn" id="retryBtn">🔄 تلاش مجدد</button>
                    `;
                    document.getElementById('retryBtn')?.addEventListener('click', () => fetchBanner(currentLang));
                    actionBtn.textContent = 'تلاش مجدد';
                    actionBtn.onclick = () => fetchBanner(currentLang);
                    statusMsg.textContent = 'خطا: داده‌ای وجود ندارد';
                    statusMsg.className = 'status error';
                    return;
                }

                titleEl.textContent = data.title || '📢 Announcement';
                subEl.textContent = data.sub || 'Latest news & updates';
                htmlContainer.innerHTML = data.html || '<div class="placeholder">No content</div>';
                htmlContainer.classList.remove('hidden');
                loaderWrap.classList.add('hidden');

                const btn = data.button || { label: '📖 View', link: '#' };
                actionBtn.textContent = btn.label || '📖 View';
                actionBtn.onclick = () => {
                    if (btn.link && btn.link !== '#') {
                        window.open(btn.link, '_blank');
                    } else {
                        alert('لینکی تنظیم نشده است.');
                    }
                };
            }

            async function tryFetch(url) {
                const bustUrl = url + (url.includes('?') ? '&' : '?') +
                    't=' + Date.now() + '&r=' + Math.random().toString(36).substring(2, 8);

                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('تایم‌اوت (' + (FETCH_TIMEOUT_MS / 1000) + 's)')), FETCH_TIMEOUT_MS);
                });

                const fetchPromise = fetch(bustUrl, { method: 'GET', cache: 'no-store' })
                    .then(async (response) => {
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        const text = await response.text();
                        const match = text.match(/window\.BANNER_DATA\s*=\s*({[\s\S]*?});/);
                        if (!match) throw new Error('ساختار نامعتبر در پاسخ');
                        return JSON.parse(match[1]);
                    });

                return Promise.race([fetchPromise, timeoutPromise]);
            }

            async function fetchBanner(lang) {
                if (isFetching) return;
                isFetching = true;

                titleEl.textContent = '⏳ در حال بارگذاری…';
                subEl.textContent = 'دریافت از GitHub';
                if (!bannerData) {
                    htmlContainer.classList.add('hidden');
                    loaderWrap.classList.remove('hidden');
                    loaderWrap.innerHTML = `
                        <div class="loader"></div>
                        <span style="color:#8d8a9a;font-size:13px;">دریافت از GitHub…</span>
                    `;
                }
                statusMsg.textContent = 'در حال دریافت…';
                statusMsg.className = 'status';

                let json = null;
                let lastError = null;

                for (let i = 0; i < SOURCES.length; i++) {
                    try {
                        json = await tryFetch(SOURCES[i]);
                        break;
                    } catch (err) {
                        lastError = err;
                        console.warn('منبع ناموفق:', SOURCES[i], err.message);
                        continue;
                    }
                }

                if (json) {
                    try {
                        localStorage.setItem(CACHE_KEY, JSON.stringify(json));
                        localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
                    } catch (_) {}

                    bannerData = json;
                    const data = json[lang] || json.en;
                    render(lang, data);

                    statusMsg.textContent = '✅ بارگذاری موفق';
                    statusMsg.className = 'status success';
                } else {
                    console.error('❌ همه منابع شکست خوردند:', lastError);
                    try {
                        const cached = localStorage.getItem(CACHE_KEY);
                        if (cached) {
                            const cachedJson = JSON.parse(cached);
                            bannerData = cachedJson;
                            const data = cachedJson[lang] || cachedJson.en;
                            if (data) {
                                render(lang, data);
                                const cacheTime = localStorage.getItem(CACHE_TIME_KEY);
                                const ago = cacheTime ? Math.round((Date.now() - Number(cacheTime)) / 60000) : null;
                                statusMsg.textContent = ago !== null
                                    ? `⚠️ عدم اتصال — نمایش کش (${ago} دقیقه پیش)`
                                    : '⚠️ عدم اتصال — نمایش کش محلی';
                                statusMsg.className = 'status info';
                                isFetching = false;
                                return;
                            }
                        }
                    } catch (_) {}
                    render(lang, null);
                    statusMsg.textContent = '❌ خطا: ' + (lastError ? lastError.message : 'اتصال برقرار نشد');
                    statusMsg.className = 'status error';
                }

                isFetching = false;
            }

            closeBtn.addEventListener('click', function (e) {
                e.preventDefault();
                window.location.href = 'index2.html';
            });

            window.addEventListener('online', () => {
                if (!bannerView.classList.contains('hidden')) fetchBanner(currentLang);
            });

            // ============================================================
            //  INIT — اگه قبلاً انتخاب شده بود، مستقیم بنر رو نشون بده
            //  و گرنه صفحه‌ی setup رو نشون بده
            // ============================================================
            (function init() {
                try {
                    const saved = localStorage.getItem(ONBOARDING_KEY);
                    if (saved) {
                        const data = JSON.parse(saved);
                        if (data && data.done) {
                            showBanner(data.lang || 'fa', data.theme || 'dark');
                            return;
                        }
                    }
                } catch (_) {}

                // هنوز انتخاب نکرده: صفحه‌ی setup با پیش‌فرض فارسی/تاریک نمایش داده می‌شه
                applySetupUiLang('fa');
                applyDocLangDir('fa');
            })();

        })();
    </script>
</body>
</html>
