<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ===== META TAGS TO PREVENT CACHING ===== -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Second Brain · مغز دوم</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            background: #0e0e14;
            color: #eae7de;
            font-family: 'Segoe UI', 'Vazirmatn', sans-serif;
            font-size: 15px;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }

        /* ===== LOADING SCREEN ===== */
        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0e0e14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity .55s ease, visibility .55s ease;
        }
        #loadingScreen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .load-brand {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: .5px;
            color: #eae7de;
        }
        .load-msg {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: #5f5d6b;
            min-height: 16px;
        }

        /* ===== OVERLAY PAGES ===== */
        .overlay-page {
            position: fixed;
            inset: 0;
            z-index: 8000;
            background: rgba(14, 14, 20, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity .4s ease, transform .4s ease;
            opacity: 0;
            transform: scale(0.97);
            pointer-events: none;
        }
        .overlay-page.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .overlay-card {
            background: #1a1a24;
            border: 1px solid #323242;
            border-radius: 20px;
            padding: 32px 36px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .overlay-card h2 {
            font-family: 'Fraunces', serif;
            font-size: 24px;
            margin-bottom: 12px;
            color: #eae7de;
            text-align: center;
        }
        .overlay-card p {
            color: #8d8a9a;
            font-size: 14px;
            line-height: 1.8;
            text-align: center;
            margin-bottom: 20px;
        }

        /* ===== SETTINGS PAGE ===== */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a38;
            gap: 12px;
            flex-wrap: wrap;
        }
        .settings-row .label {
            font-weight: 500;
            color: #c9c6bd;
            font-size: 14px;
        }
        .settings-row .options {
            display: flex;
            gap: 6px;
            background: #1e1e28;
            border-radius: 30px;
            padding: 3px;
            border: 1px solid #323242;
        }
        .settings-row .options button {
            background: transparent;
            border: none;
            color: #8d8a9a;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            transition: .15s;
        }
        .settings-row .options button.active {
            background: #d6a35c;
            color: #0e0e14;
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(214, 163, 92, 0.3);
        }
        .settings-row .options button:hover:not(.active) {
            color: #eae7de;
        }
        .settings-submit {
            width: 100%;
            margin-top: 16px;
            background: #d6a35c;
            color: #0e0e14;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: .15s;
        }
        .settings-submit:hover {
            background: #e2b06f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(214, 163, 92, 0.3);
        }

        /* ===== BANNER / AD PAGE ===== */
        .banner-area {
            margin: 12px 0 18px;
            border-radius: 16px;
            overflow: hidden;
            background: #1e1e28;
            border: 1px solid #323242;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            text-align: center;
            transition: .2s;
            position: relative;
        }
        .banner-area img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
        }
        .banner-area .placeholder-banner {
            color: #5f5d6b;
            font-size: 13px;
        }
        .banner-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            justify-content: center;
        }
        .banner-actions .btn {
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: .15s;
        }
        .banner-actions .btn-primary {
            background: #d6a35c;
            color: #0e0e14;
        }
        .banner-actions .btn-primary:hover {
            background: #e2b06f;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(214, 163, 92, 0.3);
        }

        .close-banner {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: none;
            color: #5f5d6b;
            font-size: 24px;
            cursor: pointer;
            transition: .15s;
            line-height: 1;
            z-index: 10;
            text-decoration: none;
        }
        .close-banner:hover {
            color: #cf6f6f;
            transform: rotate(90deg);
        }
        [dir="rtl"] .close-banner {
            right: auto;
            left: 16px;
        }

        /* ===== BANNER LOADING SPINNER ===== */
        .banner-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .banner-loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(214, 163, 92, 0.15);
            border-top-color: #d6a35c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .banner-loader .spinner-text {
            color: #8d8a9a;
            font-size: 13px;
            font-family: 'IBM Plex Mono', monospace;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== LANGUAGE SWITCHER (shared) ===== */
        .lang-switcher {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 14px;
        }
        .lang-switcher button {
            background: transparent;
            border: 1px solid #323242;
            color: #8d8a9a;
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: .15s;
        }
        .lang-switcher button.active {
            background: #d6a35c;
            color: #0e0e14;
            border-color: #d6a35c;
            font-weight: 600;
        }
        .lang-switcher button:hover:not(.active) {
            border-color: #d6a35c;
            color: #eae7de;
        }

        /* ===== MAIN APP ===== */
        #appRoot {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }
        #appRoot.visible {
            display: flex;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .overlay-card {
                padding: 24px 18px;
                margin: 10px;
            }
            .settings-row {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .settings-row .options {
                align-self: stretch;
                justify-content: center;
            }
            .banner-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .close-banner {
                top: 12px;
                right: 12px;
            }
            [dir="rtl"] .close-banner {
                right: auto;
                left: 12px;
            }
            .lang-switcher button {
                font-size: 12px;
                padding: 3px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="loadingScreen">
        <div class="load-brand">Second Brain</div>
        <div class="load-msg" id="loadMsg">Waking up…</div>
    </div>

    <!-- ===== OVERLAY: SETTINGS ===== -->
    <div class="overlay-page" id="settingsPage">
        <div class="overlay-card">
            <h2 id="settingsTitle">⚙️ Initial Setup</h2>
            <p id="settingsDesc">Choose your preferences. This page appears only once.</p>
            <div class="settings-row">
                <span class="label" id="themeLabel">🌓 Theme</span>
                <div class="options" id="themeOptions">
                    <button class="active" data-value="dark">Dark</button>
                    <button data-value="light">Light</button>
                </div>
            </div>
            <div class="settings-row">
                <span class="label" id="langLabel">🌐 Language</span>
                <div class="options" id="langOptions">
                    <button class="active" data-value="en">English</button>
                    <button data-value="fa">فارسی</button>
                </div>
            </div>
            <button class="settings-submit" id="settingsSubmit">✅ Continue</button>
        </div>
    </div>

    <!-- ===== OVERLAY: BANNER ===== -->
    <div class="overlay-page" id="bannerPage">
        <div class="overlay-card">
            <a class="close-banner" id="closeBannerBtn" href="index2.html">✕</a>
            <h2 id="bannerTitle">📢 Announcement</h2>
            <p id="bannerSub" style="font-size:13px;color:#8d8a9a;">Latest news & updates</p>
            <div class="banner-area" id="bannerArea">
                <div id="bannerLoader" class="banner-loader">
                    <div class="spinner"></div>
                    <div class="spinner-text">Loading content…</div>
                </div>
                <div id="bannerContent" style="display:none;"></div>
            </div>
            <div class="banner-actions">
                <button class="btn btn-primary" id="bannerActionBtn">📖 View</button>
            </div>
            <div class="lang-switcher">
                <button id="langEn" class="active">English</button>
                <button id="langFa">فارسی</button>
            </div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="appRoot">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#5f5d6b;font-size:18px;flex-direction:column;gap:12px;">
            <div style="font-size:48px;">🧠</div>
            <div>Second Brain — Ready</div>
            <div style="font-size:13px;color:#3a3a4a;">(Main app loads here)</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  1.  LOADING SCREEN
            // ================================================================
            const loadMsgEl = document.getElementById('loadMsg');
            const loadingMessages = ['Waking up…', 'Loading banner…', 'Almost ready…'];
            let msgIdx = 0;
            const msgInterval = setInterval(() => {
                msgIdx = (msgIdx + 1) % loadingMessages.length;
                loadMsgEl.style.opacity = 0;
                setTimeout(() => {
                    loadMsgEl.textContent = loadingMessages[msgIdx];
                    loadMsgEl.style.opacity = 1;
                }, 200);
            }, 600);

            function hideLoading() {
                clearInterval(msgInterval);
                document.getElementById('loadingScreen').classList.add('hide');
            }

            // ================================================================
            //  2.  SETTINGS
            // ================================================================
            const SETTINGS_KEY = 'second-brain-settings-v1';

            function getStoredSettings() {
                try {
                    const raw = localStorage.getItem(SETTINGS_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (_) {}
                return null;
            }

            function saveSettings(settings) {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
            }

            const settingsPage = document.getElementById('settingsPage');
            const themeBtns = document.querySelectorAll('#themeOptions button');
            const langBtns = document.querySelectorAll('#langOptions button');
            const settingsSubmit = document.getElementById('settingsSubmit');

            const settingsI18n = {
                en: {
                    title: '⚙️ Initial Setup',
                    desc: 'Choose your preferences. This page appears only once.',
                    theme: '🌓 Theme',
                    lang: '🌐 Language',
                    continue: '✅ Continue'
                },
                fa: {
                    title: '⚙️ تنظیمات اولیه',
                    desc: 'تنظیمات دلخواه خود را انتخاب کنید. این صفحه فقط یکبار نمایش داده می‌شود.',
                    theme: '🌓 تم',
                    lang: '🌐 زبان',
                    continue: '✅ ادامه'
                }
            };

            let selectedTheme = 'dark';
            let selectedLang = 'en';

            const stored = getStoredSettings();
            if (stored && stored.configured) {
                selectedTheme = stored.theme || 'dark';
                selectedLang = stored.lang || 'en';
            }

            function updateSettingsUI(lang) {
                const t = settingsI18n[lang] || settingsI18n.en;
                document.getElementById('settingsTitle').textContent = t.title;
                document.getElementById('settingsDesc').textContent = t.desc;
                document.getElementById('themeLabel').textContent = t.theme;
                document.getElementById('langLabel').textContent = t.lang;
                settingsSubmit.textContent = t.continue;
            }

            updateSettingsUI(selectedLang);

            langBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.value === selectedLang);
            });
            themeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.value === selectedTheme);
            });

            themeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    themeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedTheme = btn.dataset.value;
                });
            });
            langBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    langBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedLang = btn.dataset.value;
                    updateSettingsUI(selectedLang);
                    document.documentElement.dir = selectedLang === 'fa' ? 'rtl' : 'ltr';
                    document.documentElement.lang = selectedLang;
                });
            });

            settingsSubmit.addEventListener('click', () => {
                const settings = {
                    theme: selectedTheme,
                    lang: selectedLang,
                    configured: true,
                    timestamp: Date.now()
                };
                saveSettings(settings);
                applyTheme(selectedTheme);
                applyLang(selectedLang);
                settingsPage.classList.remove('show');
                showBannerPage(selectedLang);
            });

            function applyTheme(theme) {
                if (theme === 'light') {
                    document.documentElement.style.setProperty('--bg', '#f5f3f0');
                    document.documentElement.style.setProperty('--surface', '#efede8');
                    document.documentElement.style.setProperty('--text', '#1e1e24');
                    document.documentElement.style.setProperty('--text-dim', '#5a5a6a');
                } else {
                    document.documentElement.style.setProperty('--bg', '#0e0e14');
                    document.documentElement.style.setProperty('--surface', '#16161e');
                    document.documentElement.style.setProperty('--text', '#eae7de');
                    document.documentElement.style.setProperty('--text-dim', '#8d8a9a');
                }
            }

            function applyLang(lang) {
                document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
                document.documentElement.lang = lang;
                if (settingsPage.classList.contains('show')) {
                    updateSettingsUI(lang);
                }
                document.querySelectorAll('.lang-switcher button, #langOptions button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.value === lang || btn.id === 'lang' + lang.charAt(0)
                        .toUpperCase() + lang.slice(1));
                });
                if (bannerPage.classList.contains('show')) {
                    fetchBanner(lang);
                }
            }

            // ================================================================
            //  3.  BANNER — ALWAYS FETCH FROM GITHUB, NEVER FROM CACHE
            // ================================================================
            const bannerPage = document.getElementById('bannerPage');
            const bannerContent = document.getElementById('bannerContent');
            const bannerLoader = document.getElementById('bannerLoader');
            const bannerTitle = document.getElementById('bannerTitle');
            const bannerSub = document.getElementById('bannerSub');
            const bannerActionBtn = document.getElementById('bannerActionBtn');

            // 🔥 Your exact GitHub raw URL
            const BANNER_URL = 'https://raw.githubusercontent.com/IQZEUS/brainmain/refs/heads/main/banner.json';

            // Fallback default (only used if network is completely down)
            const defaultBanner = {
                en: {
                    title: '📢 Announcement',
                    sub: 'Latest news & updates',
                    html: '<div class="placeholder-banner">No content from GitHub yet.<br>Check your BANNER_URL.</div>',
                    button: { label: '📖 View', link: 'https://github.com/IQZEUS/brainmain' }
                },
                fa: {
                    title: '📢 اطلاع‌رسانی',
                    sub: 'آخرین اخبار و بروزرسانی‌ها',
                    html: '<div class="placeholder-banner">محتوایی از گیت دریافت نشد.<br>آدرس BANNER_URL را بررسی کنید.</div>',
                    button: { label: '📖 مشاهده', link: 'https://github.com/IQZEUS/brainmain' }
                }
            };

            let isBannerLoading = false;

            // ================================================================
            //  RENDER — updates ALL elements from data
            // ================================================================
            function renderBanner(lang, data) {
                if (!data) {
                    data = defaultBanner[lang] || defaultBanner.en;
                }

                // 🔥 UPDATE every single part from JSON
                bannerTitle.textContent = data.title || '📢 Announcement';
                bannerSub.textContent = data.sub || 'Latest news & updates';
                bannerContent.innerHTML = data.html || '<div class="placeholder-banner">No content</div>';

                const btn = data.button || { label: '📖 View', link: '#' };
                bannerActionBtn.textContent = btn.label || '📖 View';
                bannerActionBtn.onclick = () => {
                    if (btn.link && btn.link !== '#') window.open(btn.link, '_blank');
                    else alert('No link configured.');
                };

                // Show content, hide loader
                bannerLoader.style.display = 'none';
                bannerContent.style.display = 'block';

                console.log('✅ Banner rendered from GitHub data at:', new Date().toLocaleTimeString());
            }

            // ================================================================
            //  FETCH — ALWAYS FRESH, ignores all caches
            // ================================================================
            async function fetchBanner(lang) {
                if (isBannerLoading) return;
                isBannerLoading = true;

                // Show loader, hide content
                bannerLoader.style.display = 'flex';
                bannerContent.style.display = 'none';

                try {
                    // 🔥🔥🔥 TRIPLE CACHE-BUSTING:
                    // 1. Timestamp (ms)
                    // 2. Random string
                    // 3. Unique request ID
                    const uniqueId = Date.now().toString(36) + Math.random().toString(36).substring(2, 10);
                    const cacheBuster = '?t=' + Date.now() + '&r=' + Math.random().toString(36).substring(2, 10) +
                        '&id=' + uniqueId;

                    const response = await fetch(BANNER_URL + cacheBuster, {
                        method: 'GET',
                        cache: 'reload', // forces browser to bypass cache
                        headers: {
                            'Cache-Control': 'no-cache, no-store, must-revalidate',
                            'Pragma': 'no-cache',
                            'Expires': '0'
                        }
                    });

                    if (!response.ok) throw new Error('HTTP ' + response.status);

                    const json = await response.json();
                    console.log('📥 Fresh data received from GitHub at:', new Date().toLocaleTimeString());

                    // Store in localStorage only as backup for offline
                    localStorage.setItem('banner-cache', JSON.stringify(json));

                    const data = json[lang] || json.en;
                    if (data) {
                        renderBanner(lang, data);
                    } else {
                        console.warn('No data for language:', lang);
                        renderBanner(lang, defaultBanner[lang] || defaultBanner.en);
                    }

                } catch (error) {
                    console.warn('❌ Network error fetching from GitHub:', error);

                    // ⚠️ Only fallback to cache if network is down
                    try {
                        const cached = localStorage.getItem('banner-cache');
                        if (cached) {
                            const parsed = JSON.parse(cached);
                            const data = parsed[lang] || parsed.en;
                            if (data) {
                                console.log('📦 Using cached data (network unavailable)');
                                renderBanner(lang, data);
                                isBannerLoading = false;
                                return;
                            }
                        }
                    } catch (_) {}

                    // Final fallback
                    renderBanner(lang, defaultBanner[lang] || defaultBanner.en);
                }

                isBannerLoading = false;
            }

            // ================================================================
            //  SHOW BANNER PAGE
            // ================================================================
            function showBannerPage(lang) {
                bannerPage.classList.add('show');
                // Update language switcher buttons
                document.querySelectorAll('.lang-switcher button').forEach(btn => {
                    btn.classList.toggle('active', (btn.id === 'langEn' && lang === 'en') || (btn.id === 'langFa' &&
                        lang === 'fa'));
                });
                fetchBanner(lang);
            }

            // ================================================================
            //  4.  LANGUAGE SWITCHER (shared)
            // ================================================================
            document.getElementById('langEn').addEventListener('click', function() {
                if (selectedLang === 'en') return;
                selectedLang = 'en';
                applyLang('en');
                if (settingsPage.classList.contains('show')) {
                    langBtns.forEach(b => b.classList.toggle('active', b.dataset.value === 'en'));
                }
                const settings = getStoredSettings() || { theme: selectedTheme, lang: 'en', configured: true };
                settings.lang = 'en';
                saveSettings(settings);
            });

            document.getElementById('langFa').addEventListener('click', function() {
                if (selectedLang === 'fa') return;
                selectedLang = 'fa';
                applyLang('fa');
                if (settingsPage.classList.contains('show')) {
                    langBtns.forEach(b => b.classList.toggle('active', b.dataset.value === 'fa'));
                }
                const settings = getStoredSettings() || { theme: selectedTheme, lang: 'fa', configured: true };
                settings.lang = 'fa';
                saveSettings(settings);
            });

            // ================================================================
            //  5.  INIT
            // ================================================================
            (async function init() {
                await new Promise(r => setTimeout(r, 1500));
                hideLoading();

                const settings = getStoredSettings();
                if (!settings || !settings.configured) {
                    settingsPage.classList.add('show');
                } else {
                    applyTheme(settings.theme || 'dark');
                    applyLang(settings.lang || 'en');
                    showBannerPage(settings.lang || 'en');
                }
            })();

            // ================================================================
            //  Reset for testing:
            //  localStorage.removeItem('second-brain-settings-v1');
            //  localStorage.removeItem('banner-cache');
            //  location.reload();
            // ================================================================
        })();
    </script>
</body>
</html>
